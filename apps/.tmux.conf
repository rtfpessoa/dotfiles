# Use tmux terminfo inside panes. Do not set this to xterm-256color.
set -g default-terminal "tmux-256color"

# Truecolor and modern modified-key support for common outer terminals.
set -as terminal-features ',xterm*:RGB,extkeys'
set -as terminal-features ',tmux*:RGB,extkeys'

# Use Ctrl+A as the prefix key
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Makes Esc feel responsive in Vim, Neovim, Helix, lazygit, Claude Code, etc.
set -sg escape-time 10

# Mouse support for pane selection, resizing, copy mode, and TUI mouse events.
set -g mouse on

# Puts tmux status away from bottom-prompt TUIs like Claude Code and editors.
set -g status-position top

# Vim keys in copy mode
setw -g mode-keys vi
set -g status-keys vi

# Larger scrollback
set -g history-limit 1000000

# Start windows and panes at 1 (optional, many people prefer it)
set -g base-index 1
setw -g pane-base-index 1

# Keep splits consistent
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind "\""
unbind %
bind c new-window -a -c "#{pane_current_path}"

bind < swap-window -d -t "-1"
bind > swap-window -d -t "+1"

# Kill without prompting for confirmation
bind x kill-pane
bind q kill-session

# Easy reload
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

# Quality of life: re-number windows when one is closed
set -g renumber-windows on

# Copy to macOS clipboard when you press y in copy mode
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Optional: also copy on Enter, if you like that muscle memory
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

bind-key C-l send-keys C-l \; clear-history

set -g automatic-rename on
# Prevent random programs from renaming tmux windows.
set -g allow-rename off
set -g window-status-format '#I:#W'
set -g window-status-current-format '[#I:#W]'
set -g window-status-current-style 'bold'
# Required for Claude Code Shift+Enter inside tmux.
set -s extended-keys on
set -g extended-keys-format csi-u

# Required for Claude Code notifications/progress passthrough inside tmux.
set -g allow-passthrough on

# Helps editors and TUIs notice terminal focus changes.
set -g focus-events on

# Safer default: tmux can write to the system clipboard, but apps inside tmux
# cannot freely set tmux buffers through clipboard escape sequences.
set -g set-clipboard external

# If you rely on Neovim/OSC52/yazi/etc. copying directly to the system clipboard
# from inside tmux, use this instead, but only on machines you trust:
# set -g set-clipboard on
